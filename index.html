<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>건강 일지</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="건강 일지" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .app-title {
      font-size: 24px;
      font-weight: 600;
      color: #111;
      margin-bottom: 0.25rem;
    }

    .app-subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 2rem;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    .field input[type="date"],
    .field textarea {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      background: #fafafa;
      color: #111;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .field input[type="date"]:focus,
    .field textarea:focus {
      border-color: #111;
      background: #fff;
    }

    .field textarea {
      height: 120px;
      resize: none;
      line-height: 1.6;
    }

    .error-msg {
      display: none;
      font-size: 13px;
      color: #c0392b;
      margin-top: 8px;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      font-size: 17px;
      font-weight: 600;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: opacity 0.15s, transform 0.1s;
    }

    .submit-btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .confirm {
      display: none;
      text-align: center;
      padding: 1.5rem 0;
    }

    .confirm-icon {
      font-size: 56px;
      margin-bottom: 1rem;
    }

    .confirm-title {
      font-size: 20px;
      font-weight: 600;
      color: #111;
      margin-bottom: 0.5rem;
    }

    .confirm-sub {
      font-size: 14px;
      color: #888;
      margin-bottom: 1.75rem;
      line-height: 1.6;
    }

    .again-btn {
      background: none;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      color: #111;
      font-family: inherit;
      transition: background 0.15s;
    }

    .again-btn:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="card">

    <div id="formView">
      <div class="app-title">건강 일지</div>
      <div class="app-subtitle">오늘의 증상을 기록해 주세요</div>

      <div class="field">
        <label>날짜</label>
        <input type="date" id="dateInput" />
      </div>

      <div class="field">
        <label>증상</label>
        <textarea id="symptomInput" placeholder="오늘 느끼는 증상을 적어주세요..."></textarea>
      </div>

      <div id="errorMsg" class="error-msg">날짜와 증상을 모두 입력해 주세요.</div>

      <button class="submit-btn" onclick="submitLog()">저장하기</button>
    </div>

    <div class="confirm" id="confirmView">
      <div class="confirm-icon">✅</div>
      <div class="confirm-title">저장되었습니다</div>
      <div class="confirm-sub">기록이 건강 일지에 저장되었습니다.<br />내일 또 기록해 주세요 😊</div>
      <button class="again-btn" onclick="resetForm()">다시 입력하기</button>
    </div>

  </div>

  <script>
    const WEBHOOK = "https://script.google.com/macros/s/AKfycbw8xmolisC6whodkPPfdtsdbIvXeDEpeImSwHkpaRVno-u6vi1osomSwfdjEXR3B0cLEw/exec";

    const today = new Date().toLocaleDateString("en-CA");
    document.getElementById("dateInput").value = today;

    async function submitLog() {
      const date = document.getElementById("dateInput").value;
      const symptom = document.getElementById("symptomInput").value.trim();
      const err = document.getElementById("errorMsg");

      if (!date || !symptom) {
        err.style.display = "block";
        return;
      }
      err.style.display = "none";

      const btn = document.querySelector(".submit-btn");
      btn.textContent = "저장 중...";
      btn.disabled = true;

      try {
        await fetch(WEBHOOK, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date, symptom })
        });
        document.getElementById("formView").style.display = "none";
        document.getElementById("confirmView").style.display = "block";
      } catch (e) {
        err.textContent = "오류가 발생했습니다. 다시 시도해 주세요.";
        err.style.display = "block";
        btn.textContent = "저장하기";
        btn.disabled = false;
      }
    }

    function resetForm() {
      document.getElementById("symptomInput").value = "";
      document.getElementById("dateInput").value = today;
      document.getElementById("formView").style.display = "block";
      document.getElementById("confirmView").style.display = "none";
    }
  </script>
</body>
</html>
